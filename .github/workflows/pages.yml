# Publishes only the site files to GitHub Pages, so build scripts, the README and
# other repository files are not served. To use it, set Settings > Pages > Source
# to "GitHub Actions". It runs on every push to prod, or by hand from the Actions tab.
name: Deploy to GitHub Pages

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Collect site files
        run: |
          mkdir _site
          cp -R index.html privacy.html manifest.webmanifest sw.js robots.txt sitemap.xml CNAME \
                css js data assets vendor _site/
          # Fail if anything private slipped in.
          if find _site -name '*.md' -o -name 'package*.json' -o -name '*.mjs' | grep -q .; then
            echo "Unexpected files in _site" >&2; exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
